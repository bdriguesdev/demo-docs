name: Sync OpenAPI spec from API repo

on:
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch:
    inputs:
      api_repo:
        description: "owner/repo of the API repo"
        required: true
        default: ""
      api_ref:
        description: "Commit SHA or branch in the API repo to sync from"
        required: true
        default: "main"

permissions:
  contents: write
  pull-requests: write

env:
  DEFAULT_API_REPO: ${{ github.repository_owner }}/demo-api

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine source repo and ref
        id: source
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ] then
            echo "repo=${{ github.event.client_payload.repo }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.client_payload.ref }}" >> "GITHUB_OUTPUT"
          else
            REPO="${{ github.events.inputs.api_repo }}"
            echo "repo=${REPO:-$DEFAULT_API_REPO}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.events.inputs.api_ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch latest OpenAPI spec and changelog
        run: |
          SRC_REPO="${{ steps.source.outputs.repo }}"
          SRC_REF="${{ steps.source.outputs.ref }}"
          echo "Fetching from $SRC_REPO@$SRC_REF"
          curl -fsSL "https://raw.githubusercontent.com/${SRC_REPO}/openapi.yaml" -o openapi.yaml
          curl -fsSL "https://raw.githubusercontent.com/${SRC_REPO}/CHANGELOG.md" -o CHANGELOG.md

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- openapi.yaml CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Open PR with the update
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_REPO: ${{ steps.source.outputs.repo }}
          SRC_REF: ${{ steps.source.outputs.ref }}
        run: |
          BRANCH="feature/MT-00000-sync-${SRC_REF}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add openapi.yaml CHANGELOG.md
          git commit -m "Sync OpenAPI spec and changelog from ${SRC_REPO}@${SRC_REF}"
          git push -u origin "$BRANCH" --force
          
          cat > /tmp/pr-body.md <<EOF
          Automated sync triggered by a prod deploy in [$SRC_REPO](https://github.com/${SRC_REPO}) at commit \`${SRC_REF}\`.

          Please review the diff below and merge to update the live docs site
          EOF

          gh pr create \
            --title "Sync OpenAPI spec and changelog (${SRC_REF})"  \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH"
          || echo "A PR for this branch may already be open - nothing new to create"

      - name: No changes detected
        if: steps.diff.outputs.changed == 'false'
        run: echo "OpenAPI spec and changelog already match the API repo, nothing to sync"

      
